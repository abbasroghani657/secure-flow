<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pentrixa — Find vulnerabilities before hackers do</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html { scroll-behavior: smooth; }
      body { margin: 0; background: #0A0E12; color: #F3F6FA; font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
      * { box-sizing: border-box; }
      a { color: #06B6D4; text-decoration: none; }
      a:hover { color: #22D3EE; }
      ::selection { background: rgba(6,182,212,0.35); }
      :focus-visible { outline: 2px solid #06B6D4; outline-offset: 2px; }
      input::placeholder { color: #565E6A; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
      @keyframes scanSweep { 0% { transform: translateY(-100%); } 100% { transform: translateY(420px); } }
      @keyframes authSweep { 0% { transform: translateY(-140px); opacity: 0; } 45% { opacity: 1; } 100% { transform: translateY(100vh); opacity: 0; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      .auth-mobile-logo { display: none; }
      @media (max-width: 860px) {
        .auth-grid { grid-template-columns: 1fr !important; }
        .auth-panel { display: none !important; }
        .auth-mobile-logo { display: block; }
      }
      a.blog-card, a.blog-lead { transition: border-color .18s ease, transform .18s ease; }
      a.blog-card:hover, a.blog-lead:hover { border-color: rgba(6,182,212,0.4); }
      .btn-primary { transition: transform .14s ease, box-shadow .2s ease, filter .14s ease; }
      .btn-primary:hover { transform: translateY(-1.5px); box-shadow: 0 10px 26px -6px rgba(6,182,212,0.5); filter: brightness(1.06); }
      .btn-primary:active { transform: translateY(0); filter: brightness(0.97); }
      .btn-ghost { transition: border-color .15s ease, background .15s ease, color .15s ease; }
      .btn-ghost:hover { border-color: rgba(6,182,212,0.55); background: rgba(6,182,212,0.07); color: #22D3EE; }
      .feat-card { transition: transform .18s ease, border-color .18s ease, background .18s ease; }
      .feat-card:hover { transform: translateY(-3px); border-color: rgba(6,182,212,0.35); background: rgba(6,182,212,0.03); }
      .arrow-cta svg, .arrow-cta { transition: transform .16s ease; }
      .arrow-cta:hover svg { transform: translateX(3px); }
      @media (max-width: 900px) {
        .hero-grid { grid-template-columns: 1fr !important; }
        .score-grid { grid-template-columns: 1fr !important; }
        .feat-row { grid-template-columns: 1fr !important; }
        .feat-row > div { order: 0 !important; }
        .blog-lead-grid { grid-template-columns: 1fr !important; }
        .how-surfaces { grid-template-columns: 1fr !important; }
        .how-audiences { grid-template-columns: 1fr !important; }
        .how-step { grid-template-columns: 1fr !important; }
        .how-step .how-tag { justify-self: start; }
      }
      @media (max-width: 760px) {
        .footer-grid { grid-template-columns: 1fr 1fr !important; }
        .stats-band { grid-template-columns: 1fr 1fr !important; }
        .mkt-navlinks { display: none !important; }
        .finding-meta { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
